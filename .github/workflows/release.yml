name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    env:
      VITE_API_BASE_URL: https://streampeek-production.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test desktop
        working-directory: apps/desktop
        run: bun run test

      - name: Build tauri & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "StreamPeek ${{ github.ref_name }}"
          releaseBody: |
            Beta release. Unsigned binaries — your OS may show a security warning on first launch.

            - **Windows:** SmartScreen → "More info" → "Run anyway".
            - **Linux:** `.deb`/`.rpm` install normally; `.AppImage` needs `chmod +x` first.
          releaseDraft: true
          prerelease: true
