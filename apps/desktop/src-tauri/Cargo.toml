[package]
name = "streampeek-desktop"
version = "0.1.0"
description = "Desktop client that notifies users when followed Twitch streamers go live"
repository = "https://github.com/ThiagoFang/streampeek"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "streampeek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
zbus = "5"
